channel:
  snr_definition: Es/N0 in dB per complex channel use, measured after unit-average-power
    normalisation
  snr_conversion: Es/N0_dB = Eb/N0_dB + 10*log10(bits_per_symbol * code_rate); every
    published reference curve MUST be converted with this identity before comparison
  models_supported:
  - awgn
  models_planned:
  - rayleigh_block
  - rayleigh_fast
  train_snr_db_fixed: 7
  train_snr_db_set:
  - 1
  - 4
  - 7
