  grid_rationale: 'three waterfalls have to be resolved, not one. BPSK at rate 1/3
    -- which BR-4 selects at the noisy end and which AM-15 relies on for roughly 3
    dB of extra reach -- decodes around Es/N0 = -4 to -5 dB, measured at W0 as BER
    0.0 at -4 dB and 0.31 at -8 dB, so the region from -8 to -2 carries 1 dB spacing:
