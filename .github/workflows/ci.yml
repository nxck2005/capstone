name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      PIP_CACHE_DIR: ~/.cache/pip
    steps:
      # actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-python v5.6.0
      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"

      # actions/cache v4.2.4 — dependency downloads only, never an environment.
      - name: Cache CPU dependency downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14.6-pip-${{ hashFiles('requirements-cpu.lock') }}

      - name: Install the hashed CPU lock
        run: python -m pip install --require-hashes --disable-pip-version-check -r requirements-cpu.lock

      - name: Classify the change set
        id: classify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            base="${GITHUB_SHA}^"
            head="${GITHUB_SHA}"
          else
            base="${{ github.event.before }}"
            head="${GITHUB_SHA}"
          fi
          lane="$(python tools/ci_classify_changes.py --base "$base" --head "$head")"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "selected lane: $lane"

      - name: Run software lane
        if: steps.classify.outputs.lane == 'software'
        run: python tools/run_quality_gate.py ci-cpu

      - name: Run evidence-only lane
        if: steps.classify.outputs.lane == 'evidence'
        run: python tools/run_quality_gate.py evidence
