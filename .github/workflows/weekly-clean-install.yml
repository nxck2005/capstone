name: weekly-clean-install

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-clean-install
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      PIP_CACHE_DIR: ~/.cache/pip
    steps:
      # actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-python v5.6.0
      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"

      # actions/cache v4.2.4 — dependency downloads only, never an environment.
      - name: Cache CPU dependency downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14.6-pip-${{ hashFiles('requirements-cpu.lock') }}

      - name: Cache the authenticated LDPC fixture
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: tests/fixtures/ldpc_ts38212_golden.npz
          key: ${{ runner.os }}-python-3.14.6-ldpc-fixture-55754b508ab1b6eb6625eae301d2d0a3fefcdf7b03e98038264b76b71e26aae0

      - name: Install the hashed CPU lock
        run: python -m pip install --require-hashes --disable-pip-version-check -r requirements-cpu.lock

      - name: Materialize and authenticate the external fixture
        shell: bash
        run: |
          fixture="tests/fixtures/ldpc_ts38212_golden.npz"
          expected="55754b508ab1b6eb6625eae301d2d0a3fefcdf7b03e98038264b76b71e26aae0"
          if [[ ! -f "$fixture" ]] || [[ "$(sha256sum "$fixture" | awk '{print $1}')" != "$expected" ]]; then
            python tools/fetch_ldpc_golden_vectors.py --force
          fi
          test "$(sha256sum "$fixture" | awk '{print $1}')" = "$expected"

      - name: Run the portable weekly quality gate
        env:
          CAPSTONE_INCLUDE_EXTERNAL_LDPC_FIXTURE: "1"
        run: python tools/run_quality_gate.py ci-cpu
